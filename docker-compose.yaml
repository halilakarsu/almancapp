version: '3.8'

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: almingo_app
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - postgres


  webserver:
    image: nginx:alpine
    container_name: almingo_nginx
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app


  postgres:
    image: postgres:15
    container_name: almingo_postgres
    restart: always
    environment:
      POSTGRES_DB: almingo
      POSTGRES_USER: almingo
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - almingo_pgdata:/var/lib/postgresql/data


volumes:
  almingo_pgdata:



